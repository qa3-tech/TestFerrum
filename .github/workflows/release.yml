name: Release

# Runs when a version tag without a "v" prefix is pushed, e.g. 0.2.0.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub Release and upload files

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Check versions match the tag
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          extension_version=$(node -p "require('./editors/vscode/package.json').version")
          echo "tag=$VERSION crate=$crate_version extension=$extension_version"
          if [ "$crate_version" != "$VERSION" ] || [ "$extension_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml and editors/vscode/package.json must both be version $VERSION"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Test crate
        run: |
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings

      - name: Build crate
        run: |
          cargo package
          cp "target/package/testferrum-$VERSION.crate" .

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test and build extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run lint
          npm test
          npm run package
          cp "testferrum-$VERSION.vsix" ../..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            "testferrum-$VERSION.crate" \
            "testferrum-$VERSION.vsix" \
            --title "TestFerrum $VERSION" \
            --generate-notes
